; Presence of this file next to AncientUyghurKeyboard.exe enables PORTABLE mode:
; configuration (config.ini), the log (app.log), the version marker, and the
; layouts\ folder are all kept in this application folder instead of %APPDATA%.
;
; Delete this file to make the application use the per-user %APPDATA% location.
; This file ships inside the portable ZIP only (never installed by Setup).
[portable]
enabled=1
