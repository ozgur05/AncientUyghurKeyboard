name: Build, Test, Package

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $v"

      - name: Configure (CMake, MSVC)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Run unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      # ---- Stage a clean payload shared by the ZIP and the installer ----
      - name: Stage dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build\Release\AncientUyghurKeyboard.exe dist\
          Copy-Item -Recurse layouts dist\layouts
          Copy-Item LICENSE  dist\LICENSE
          Copy-Item README.md dist\README.md

      # ---- Portable ZIP: payload + portable marker ----
      - name: Build portable ZIP
        shell: pwsh
        run: |
          $stage = "AncientUyghurKeyboard-${{ steps.ver.outputs.version }}-portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item dist\* -Recurse -Destination $stage
          Copy-Item installer\portable.ini $stage\portable.ini
          Compress-Archive -Path "$stage\*" -DestinationPath "$stage.zip" -Force
          Write-Host "Created $stage.zip"

      # ---- Installer: Inno Setup ----
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & "$iscc" "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=..\dist" installer\AncientUyghurKeyboard.iss
          Copy-Item installer\Output\AncientUyghurKeyboard_Setup.exe .\AncientUyghurKeyboard_Setup.exe

      # ---- Upload individual build artifacts ----
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AncientUyghurKeyboard-exe
          path: dist/AncientUyghurKeyboard.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AncientUyghurKeyboard-setup
          path: AncientUyghurKeyboard_Setup.exe

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AncientUyghurKeyboard-portable
          path: AncientUyghurKeyboard-*-portable.zip

      # ---- Release on tag: attach setup + portable ZIP ----
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AncientUyghurKeyboard_Setup.exe
            AncientUyghurKeyboard-*-portable.zip
            dist/AncientUyghurKeyboard.exe
